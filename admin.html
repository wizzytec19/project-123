<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firefly Café — Admin</title>
  <meta name="description" content="Firefly Café administration dashboard">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/jpeg" href="images/firefly-logo.jpg">
  <link rel="stylesheet" href="admin.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="loginView" class="login-view">
    <div class="login-card">
      <div class="brand-mark"><img src="images/firefly-logo.jpg" alt="Firefly Café"></div>
      <div class="eyebrow">FIREFLY CAFÉ</div>
      <h1>Welcome back</h1>
      <p class="muted">Sign in to manage the café.</p>
      <form id="loginForm">
        <label>Email
          <input id="loginEmail" type="email" autocomplete="email" required placeholder="admin@example.com">
        </label>
        <label>Password
          <span class="password-wrap">
            <input id="loginPassword" type="password" autocomplete="current-password" required placeholder="••••••••">
            <button type="button" id="togglePassword" class="icon-button" aria-label="Show password">Show</button>
          </span>
        </label>
        <button class="primary-button full" type="submit" id="loginButton">Sign in</button>
        <p id="loginError" class="form-error" hidden></p>
      </form>
      <p class="login-note">Administrator access is secured by Supabase Auth.</p>
    </div>
  </div>

  <div id="appView" class="app-shell" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="brand">
          <div class="brand-mark small"><img src="images/firefly-logo.jpg" alt="Firefly Café"></div>
          <div><strong>Firefly</strong><span>Café</span></div>
        </div>
        <button id="closeSidebar" class="mobile-only icon-button" aria-label="Close menu">×</button>
      </div>

      <div class="side-label">ADMIN</div>
      <nav class="nav">
        <button class="nav-item active" data-page="dashboard"><span>⌂</span> Dashboard</button>
        <button class="nav-item" data-page="reservations"><span>▣</span> Reservations <b id="pendingBadge" class="nav-badge" hidden>0</b></button>
        <button class="nav-item" data-page="orders"><span>◫</span> Orders</button>
        <button class="nav-item" data-page="menu"><span>☷</span> Menu</button>
        <button class="nav-item" data-page="gallery"><span>▧</span> Gallery</button>
        <button class="nav-item" data-page="settings"><span>⚙</span> Settings</button>
      </nav>

      <div class="sidebar-bottom">
        <div class="admin-mini">
          <div class="avatar" id="adminAvatar">A</div>
          <div><strong id="adminName">Admin</strong><span id="adminRole">Owner</span></div>
        </div>
        <button id="logoutButton" class="logout-button">↪ Logout</button>
      </div>
    </aside>

    <div class="mobile-scrim" id="mobileScrim" hidden></div>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button id="openSidebar" class="mobile-only icon-button" aria-label="Open menu">☰</button>
          <div>
            <div class="page-kicker">FIREFLY CAFÉ</div>
            <h2 id="pageTitle">Dashboard</h2>
          </div>
        </div>
        <div class="topbar-right">
          <button id="refreshButton" class="secondary-button">↻ Refresh</button>
          <div class="online-dot"><i></i> Connected</div>
        </div>
      </header>

      <section id="pageContent" class="content"></section>
    </main>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root"></div>

  <script src="supabase-config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
